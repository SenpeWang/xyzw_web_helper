server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 静态资源：哈希文件名长缓存，html 不缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location ~* \.(?:png|jpg|jpeg|gif|svg|ico|css|js|json|woff2?|ttf|bin|atlas)$ {
        expires 7d;
        try_files $uri =404;
    }

    # 后端 API：/api/v1/* 重写为 /api/*（前端 axios baseURL 是 /api/v1）
    location /api/ {
        proxy_pass         http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
    location /api/v1/ {
        rewrite ^/api/v1/(.*)$ /api/$1 break;
        proxy_pass         http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # 健康检查（后端 /health 为公开路由）
    location = /health {
        proxy_pass http://api:3000/health;
    }

    # SPA history 模式回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
